<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图库 · 个人博客</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <canvas id="particles"></canvas>
  <nav class="nav">
    <div class="wrap">
      <a class="brand" href="index.html">
        <span class="dot"></span>
        <span>个人博客<span style="color:var(--text-3);font-weight:500">.dev</span></span>
      </a>
      <button class="style-toggle" id="styleToggle" title="切换风格" aria-label="切换风格">🎨</button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">首页</a>
        <a href="gallery.html">切换图库</a>
      </div>
    </div>
  </nav>

  <main class="gallery-view">
    <div class="wrap">
      <a class="back gallery-back" href="index.html">← 返回首页</a>
      <h2 id="galleryTitle">加载中…</h2>
      <p class="sub" id="gallerySub"></p>
      <div class="gallery-grid" id="galleryGrid"></div>
      <div class="empty" id="galleryEmpty" style="display:none">
        图库为空<br>在 gallery/ 目录下放入图片（1.jpg, 2.png…），<br>然后更新 data/gallery.js 中的 total 即可。
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© <span id="year"></span> 个人博客</span>
      <span>built with html · css · vanilla js</span>
    </div>
  </footer>

  <script src="data/gallery.js"></script>
  <script src="assets/js/core.js"></script>
  <script>
    var cfg = window.GALLERY_CONFIG;
    var key = localStorage.getItem("gallery_key");
    if (!key || !cfg[key]) { window.location.href = "gallery.html"; }

    var info = cfg[key];
    document.getElementById("year").textContent = new Date().getFullYear();
    document.getElementById("galleryTitle").textContent = info.label;
    document.getElementById("gallerySub").textContent = "共 " + info.total + " 张";

    var grid = document.getElementById("galleryGrid");
    var empty = document.getElementById("galleryEmpty");
    var EXTS = ["jpg", "jpeg", "png", "webp", "gif", "bmp"];

    if (info.total === 0) {
      empty.style.display = "";
      grid.style.display = "none";
    } else {
      for (var i = 1; i <= info.total; i++) {
        var item = document.createElement("div");
        item.className = "gallery-item";
        grid.appendChild(item);
        // 自动探测图片格式
        tryLoadImage(item, i, 0);
      }
    }

    function tryLoadImage(item, num, extIdx) {
      if (extIdx >= EXTS.length) {
        item.classList.add("broken");
        item.textContent = "?";
        return;
      }
      var ext = EXTS[extIdx];
      var src = info.dir + num + "." + ext;
      var img = new Image();
      img.onload = function () {
        item.innerHTML = '<img src="' + src + '" alt="' + num + '" loading="lazy" />';
        item.addEventListener("click", function () { openLightbox(src); });
        initTilt(item);
      };
      img.onerror = function () {
        tryLoadImage(item, num, extIdx + 1);
      };
      img.src = src;
    }

    // 鼠标倾斜 + 光效
    function initTilt(el) {
      el.addEventListener("mousemove", function (e) {
        var rect = el.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var cx = rect.width / 2, cy = rect.height / 2;
        var rx = (y - cy) / cy * 6;  // 上下倾斜
        var ry = (x - cx) / cx * -6;  // 左右倾斜
        el.style.transform = "perspective(600px) rotateX(" + rx + "deg) rotateY(" + ry + "deg) scale(1.02)";
        el.style.setProperty("--mx", (x / rect.width * 100) + "%");
        el.style.setProperty("--my", (y / rect.height * 100) + "%");
      });
      el.addEventListener("mouseleave", function () {
        el.style.transform = "perspective(600px) rotateX(0deg) rotateY(0deg) scale(1)";
      });
    }

    // Lightbox
    function openLightbox(src) {
      var lb = document.createElement("div");
      lb.className = "lightbox";
      lb.innerHTML = '<img src="' + src + '" />';
      var close = document.createElement("div");
      close.className = "lightbox-close";
      close.textContent = "✕";
      document.body.appendChild(lb);
      document.body.appendChild(close);

      function dismiss() {
        document.body.removeChild(lb);
        document.body.removeChild(close);
      }
      lb.addEventListener("click", dismiss);
      close.addEventListener("click", dismiss);
      document.addEventListener("keydown", function esc(e) {
        if (e.key === "Escape") { dismiss(); document.removeEventListener("keydown", esc); }
      });
    }
  </script>
</body>
</html>
